<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - NhanPhim</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Background Video/Image -->
        <div class="auth-background">
            <div class="auth-overlay"></div>
        </div>

        <!-- Auth Form Container -->
        <div class="auth-form-container">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fas fa-film"></i>
                </div>
                <h1>NhanPhim</h1>
                <p>Trang web xem phim trực tuyến hàng đầu</p>
            </div>

            <!-- Register Form -->
            <form class="auth-form active" id="register-form">
                <h2>Đăng Ký</h2>
                <p class="form-subtitle">Tạo tài khoản để trải nghiệm tốt nhất</p>
                <div class="form-group">
                    <label for="register-name">
                        <i class="fas fa-user"></i>
                        Họ và tên
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="register-name" name="name" placeholder="Nhập họ và tên" required>
                        <i class="fas fa-check-circle input-success" style="display: none;"></i>
                        <i class="fas fa-exclamation-circle input-error" style="display: none;"></i>
                    </div>
                    <span class="form-error" id="register-name-error"></span>
                </div>

                <div class="form-group">
                    <label for="register-email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="register-email" name="email" placeholder="Nhập email" required>
                        <i class="fas fa-check-circle input-success" style="display: none;"></i>
                        <i class="fas fa-exclamation-circle input-error" style="display: none;"></i>
                    </div>
                    <span class="form-error" id="register-email-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="register-phone">
                        <i class="fas fa-phone"></i>
                        Số điện thoại
                    </label>
                    <div class="input-wrapper">
                        <input type="tel" id="register-phone" name="phone" placeholder="Nhập số điện thoại" required>
                        <i class="fas fa-check-circle input-success" style="display: none;"></i>
                        <i class="fas fa-exclamation-circle input-error" style="display: none;"></i>
                    </div>
                    <span class="form-error" id="register-phone-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="register-password">
                        <i class="fas fa-lock"></i>
                        Mật khẩu
                    </label>
                    <div class="input-wrapper">
                        <div class="password-input">
                            <input type="password" id="register-password" name="password" placeholder="Nhập mật khẩu" required>
                            <button type="button" class="password-toggle" data-target="register-password">
                                <i class="fas fa-eye eye-icon"></i>
                            </button>
                        </div>
                        <i class="fas fa-check-circle input-success" style="display: none;"></i>
                        <i class="fas fa-exclamation-circle input-error" style="display: none;"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-text" id="strength-text">Mật khẩu yếu</span>
                    </div>
                    <span class="form-error" id="register-password-error"></span>
                </div>

                <div class="form-group">
                    <label for="register-confirm-password">
                        <i class="fas fa-lock"></i>
                        Xác nhận mật khẩu
                    </label>
                    <div class="input-wrapper">
                        <div class="password-input">
                            <input type="password" id="register-confirm-password" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>
                            <button type="button" class="password-toggle" data-target="register-confirm-password">
                                <i class="fas fa-eye eye-icon"></i>
                            </button>
                        </div>
                        <i class="fas fa-check-circle input-success" style="display: none;"></i>
                        <i class="fas fa-exclamation-circle input-error" style="display: none;"></i>
                    </div>
                    <span class="form-error" id="register-confirm-password-error"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agree-terms" required>
                        <span class="checkmark">
                            <i class="fas fa-check"></i>
                        </span>
                        Tôi đồng ý với <a href="#" class="terms-link">Điều khoản sử dụng</a> và <a href="#" class="terms-link">Chính sách bảo mật</a>
                    </label>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span class="btn-text">
                        <i class="fas fa-user-plus"></i>
                        Đăng Ký
                    </span>
                    <span class="btn-loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                        Đang xử lý...
                    </span>
                </button>

                <!-- Social Login -->
                <div class="social-login">
                    <p>Hoặc đăng ký bằng</p>
                    <div class="social-buttons">
                        <button type="button" class="social-btn google-btn">
                            <i class="fab fa-google social-icon"></i>
                            Google
                        </button>
                        <button type="button" class="social-btn facebook-btn">
                            <i class="fab fa-facebook-f social-icon"></i>
                            Facebook
                        </button>
                    </div>
                </div>
            </form>

            <!-- Back to Home -->
            <div class="back-to-home">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Về trang chủ
                </a>
                <a href="auth.html" class="back-link">
                    <i class="fas fa-sign-in-alt"></i>
                    Đã có tài khoản? Đăng nhập
                </a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Enhanced Register Form Handler
        class RegisterFormHandler {
            constructor() {
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupValidation();
                this.setupPasswordStrength();
                this.setupPasswordToggle();
            }

            setupEventListeners() {
                const form = document.getElementById('register-form');
                form.addEventListener('submit', (e) => this.handleSubmit(e));

                // Real-time validation
                const inputs = form.querySelectorAll('input[required]');
                inputs.forEach(input => {
                    input.addEventListener('blur', () => this.validateField(input));
                    input.addEventListener('input', () => this.clearFieldError(input));
                });

                // Password confirmation validation
                const confirmPassword = document.getElementById('register-confirm-password');
                confirmPassword.addEventListener('input', () => this.validatePasswordMatch());
            }

            setupValidation() {
                this.validators = {
                    name: (value) => value.trim().length >= 2,
                    email: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
                    phone: (value) => /^(\+84|0)[0-9]{9,10}$/.test(value),
                    password: (value) => /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d@$!%*?&]{8,}$/.test(value)
                };
            }

            setupPasswordStrength() {
                const passwordInput = document.getElementById('register-password');
                passwordInput.addEventListener('input', () => this.updatePasswordStrength());
            }

            setupPasswordToggle() {
                document.querySelectorAll('.password-toggle').forEach(toggle => {
                    toggle.addEventListener('click', (e) => {
                        const targetId = e.target.closest('.password-toggle').dataset.target;
                        const input = document.getElementById(targetId);
                        const icon = e.target.closest('.password-toggle').querySelector('.eye-icon');
                        
                        if (input.type === 'password') {
                            input.type = 'text';
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            input.type = 'password';
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    });
                });
            }

            validateField(input) {
                const value = input.value.trim();
                const fieldType = input.name;
                const isValid = this.validators[fieldType] ? this.validators[fieldType](value) : value.length > 0;
                
                this.updateFieldState(input, isValid);
                return isValid;
            }

            validatePasswordMatch() {
                const password = document.getElementById('register-password').value;
                const confirmPassword = document.getElementById('register-confirm-password').value;
                const isValid = password === confirmPassword && password.length > 0;
                
                this.updateFieldState(document.getElementById('register-confirm-password'), isValid);
                return isValid;
            }

            updateFieldState(input, isValid) {
                const wrapper = input.closest('.input-wrapper');
                const successIcon = wrapper.querySelector('.input-success');
                const errorIcon = wrapper.querySelector('.input-error');
                const errorElement = document.getElementById(input.id + '-error');

                if (isValid) {
                    input.classList.remove('error');
                    input.classList.add('success');
                    successIcon.style.display = 'inline';
                    errorIcon.style.display = 'none';
                    errorElement.textContent = '';
                } else {
                    input.classList.remove('success');
                    input.classList.add('error');
                    successIcon.style.display = 'none';
                    errorIcon.style.display = 'inline';
                }
            }

            clearFieldError(input) {
                const errorElement = document.getElementById(input.id + '-error');
                if (errorElement) {
                    errorElement.textContent = '';
                }
            }

            updatePasswordStrength() {
                const password = document.getElementById('register-password').value;
                const strengthFill = document.getElementById('strength-fill');
                const strengthText = document.getElementById('strength-text');
                
                let strength = 0;
                let strengthClass = 'weak';
                let strengthLabel = 'Mật khẩu yếu';

                if (password.length >= 8) strength++;
                if (/[a-z]/.test(password)) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/\d/.test(password)) strength++;
                if (/[^a-zA-Z\d]/.test(password)) strength++;

                if (strength >= 4) {
                    strengthClass = 'strong';
                    strengthLabel = 'Mật khẩu mạnh';
                } else if (strength >= 3) {
                    strengthClass = 'good';
                    strengthLabel = 'Mật khẩu tốt';
                } else if (strength >= 2) {
                    strengthClass = 'fair';
                    strengthLabel = 'Mật khẩu trung bình';
                }

                strengthFill.className = `strength-fill ${strengthClass}`;
                strengthText.className = `strength-text ${strengthClass}`;
                strengthText.textContent = strengthLabel;
            }

            async handleSubmit(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                
                // Validate all fields
                const name = formData.get('name');
                const email = formData.get('email');
                const phone = formData.get('phone');
                const password = formData.get('password');
                const confirmPassword = formData.get('confirmPassword');
                const agreeTerms = document.getElementById('agree-terms').checked;

                // Validate each field
                const isNameValid = this.validateField(document.getElementById('register-name'));
                const isEmailValid = this.validateField(document.getElementById('register-email'));
                const isPhoneValid = this.validateField(document.getElementById('register-phone'));
                const isPasswordValid = this.validateField(document.getElementById('register-password'));
                const isConfirmPasswordValid = this.validatePasswordMatch();

                if (!isNameValid || !isEmailValid || !isPhoneValid || !isPasswordValid || !isConfirmPasswordValid) {
                    this.showError('Vui lòng kiểm tra lại thông tin đã nhập');
                    return;
                }

                if (!agreeTerms) {
                    this.showError('Vui lòng đồng ý với điều khoản sử dụng');
                    return;
                }

                // Show loading state
                this.setLoading(true);

                try {
                    // Simulate API call
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    this.showSuccess('Đăng ký thành công! Chuyển hướng...');
                    
                    // Redirect after success
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    
                } catch (error) {
                    this.showError('Có lỗi xảy ra. Vui lòng thử lại sau');
                } finally {
                    this.setLoading(false);
                }
            }

            setLoading(isLoading) {
                const submitBtn = document.querySelector('.auth-submit-btn');
                const btnText = submitBtn.querySelector('.btn-text');
                const btnLoading = submitBtn.querySelector('.btn-loading');

                if (isLoading) {
                    submitBtn.disabled = true;
                    btnText.style.display = 'none';
                    btnLoading.style.display = 'inline-flex';
                } else {
                    submitBtn.disabled = false;
                    btnText.style.display = 'inline-flex';
                    btnLoading.style.display = 'none';
                }
            }

            showError(message) {
                this.showMessage(message, 'error');
            }

            showSuccess(message) {
                this.showMessage(message, 'success');
            }

            showMessage(message, type) {
                // Remove existing messages
                const existingMessage = document.querySelector('.form-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                // Create new message
                const messageDiv = document.createElement('div');
                messageDiv.className = `form-message ${type}`;
                messageDiv.innerHTML = `
                    <i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i>
                    ${message}
                `;

                // Insert after form title
                const form = document.getElementById('register-form');
                const title = form.querySelector('h2');
                title.insertAdjacentElement('afterend', messageDiv);

                // Auto remove after 5 seconds
                setTimeout(() => {
                    messageDiv.remove();
                }, 5000);
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new RegisterFormHandler();
        });
    </script>
</body>
</html>
