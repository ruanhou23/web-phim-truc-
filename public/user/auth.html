<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - NhanPhim</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Background Video/Image -->
        <div class="auth-background">
            <div class="auth-overlay"></div>
        </div>

        <!-- Auth Form Container -->
        <div class="auth-form-container">
            <!-- Logo -->
            <div class="auth-logo">
                <h1>NhanPhim</h1>
                <p>Trang web xem phim trực tuyến hàng đầu</p>
            </div>

            <!-- Auth Form -->
            <div class="auth-form-wrapper">
                <!-- Toggle Buttons -->
                <div class="auth-toggle">
                    <button class="toggle-btn active" data-mode="login">Đăng Nhập</button>
                    <button class="toggle-btn" data-mode="register">Đăng Ký</button>
                </div>

                <!-- Login Form -->
                <form class="auth-form active" id="login-form">
                    <h2>Đăng Nhập</h2>
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" required>
                        <span class="form-error" id="login-email-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Mật khẩu</label>
                        <div class="password-input">
                            <input type="password" id="login-password" name="password" required>
                            <button type="button" class="password-toggle" data-target="login-password">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="form-error" id="login-password-error"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            <span class="checkmark"></span>
                            Ghi nhớ đăng nhập
                        </label>
                        <a href="#" class="forgot-password">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span class="btn-text">Đăng Nhập</span>
                        <span class="btn-loading" style="display: none;">⏳</span>
                    </button>

                    <div class="social-login">
                        <p>Hoặc đăng nhập bằng</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn google-btn">
                                <span class="social-icon">🔴</span>
                                Google
                            </button>
                            <button type="button" class="social-btn facebook-btn">
                                <span class="social-icon">📘</span>
                                Facebook
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Register Form -->
                <form class="auth-form" id="register-form">
                    <h2>Đăng Ký</h2>
                    <div class="form-group">
                        <label for="register-name">Họ và tên</label>
                        <input type="text" id="register-name" name="name" required>
                        <span class="form-error" id="register-name-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" required>
                        <span class="form-error" id="register-email-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="register-phone">Số điện thoại</label>
                        <input type="tel" id="register-phone" name="phone" required>
                        <span class="form-error" id="register-phone-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="register-password">Mật khẩu</label>
                        <div class="password-input">
                            <input type="password" id="register-password" name="password" required>
                            <button type="button" class="password-toggle" data-target="register-password">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill" id="strength-fill"></div>
                            </div>
                            <span class="strength-text" id="strength-text">Mật khẩu yếu</span>
                        </div>
                        <span class="form-error" id="register-password-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">Xác nhận mật khẩu</label>
                        <div class="password-input">
                            <input type="password" id="register-confirm-password" name="confirmPassword" required>
                            <button type="button" class="password-toggle" data-target="register-confirm-password">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="form-error" id="register-confirm-password-error"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agree-terms" required>
                            <span class="checkmark"></span>
                            Tôi đồng ý với <a href="#" class="terms-link">Điều khoản sử dụng</a>
                        </label>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span class="btn-text">Đăng Ký</span>
                        <span class="btn-loading" style="display: none;">⏳</span>
                    </button>

                    <div class="social-login">
                        <p>Hoặc đăng ký bằng</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn google-btn">
                                <span class="social-icon">🔴</span>
                                Google
                            </button>
                            <button type="button" class="social-btn facebook-btn">
                                <span class="social-icon">📘</span>
                                Facebook
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Back to Home -->
            <div class="back-to-home">
                <a href="index.html" class="back-link">
                    <span>←</span> Về trang chủ
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase Configuration -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDlk-EISr-tC0hxRZeo6FbheXabDJRUYLE",
            authDomain: "web-phim-truc-tuyen.firebaseapp.com",
            databaseURL: "https://web-phim-truc-tuyen-default-rtdb.firebaseio.com",
            projectId: "web-phim-truc-tuyen",
            storageBucket: "web-phim-truc-tuyen.firebasestorage.app",
            messagingSenderId: "331338700875",
            appId: "1:331338700875:web:78f0138f19a2240ffa95ce",
            measurementId: "G-80PL6879SG"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Make Firebase available globally
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.googleProvider = googleProvider;
        window.firebaseAuthMethods = {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signInWithPopup,
            sendPasswordResetEmail,
            onAuthStateChanged,
            signOut
        };
    </script>

    <!-- Auth Script -->
    <script src="js/auth.js"></script>
</body>
</html>
