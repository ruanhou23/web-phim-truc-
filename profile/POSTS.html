<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reinabanana - POSTS</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: "Open Sans", sans-serif; }
    .font-montserrat { font-family: "Montserrat", sans-serif; }
    /* ... (giữ nguyên các style đã có trong index (2).html) ... */
  </style>
</head>
<body class="bg-[#f9f7fa] text-[#3a3a3a] min-h-screen flex flex-col">
  <!-- Sidebar và player giữ nguyên như index (2).html -->
  <!-- Main Content chỉ gồm phần POSTS -->
  <main class="flex flex-col md:flex-row max-w-[900px] mx-auto mt-4 px-4 pb-8">
    <!-- Sidebar (copy từ index (2).html) -->
    <!-- ... -->
    <!-- Right Content: chỉ phần POSTS -->
    <section class="flex-1 ml-0 md:ml-8 mt-6 md:mt-0">
      <!-- Fish Profile Block Start -->
      <div class="bg-white rounded-lg border border-[#e6e0e9] p-4 mb-6 flex flex-col md:flex-row items-start md:items-center">
        <div class="flex-1">
          <div class="flex items-center justify-between mb-2">
            <h2 class="font-montserrat font-bold text-lg text-[#3a3a3a]">Tên loài cá</h2>
            <button class="bg-[#a88cd9] text-white text-xs font-semibold rounded px-3 py-1 hover:bg-[#8a6fc1] transition">Edit</button>
          </div>
          <div class="flex flex-col md:flex-row gap-4">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=200&q=80" alt="Ảnh cá lớn" class="w-40 h-40 object-cover rounded-lg border"/>
            <div class="flex-1 text-xs text-[#3a3a3a] space-y-1">
              <div><b>Tên khoa học:</b> ...</div>
              <div><b>Tên thường gọi:</b> ...</div>
              <div><b>Môi trường sống:</b> ...</div>
              <div><b>Kích thước:</b> ...</div>
              <div><b>Nhiệt độ sống:</b> ...</div>
              <div><b>Độ pH lý tưởng:</b> ...</div>
            </div>
          </div>
          <div class="mt-4 p-2 bg-[#f9f7fa] rounded text-xs text-[#6b6b6b] border border-[#e6e0e9]">Mô tả ngắn gọn / Ghi chú về loài cá này.</div>
          <div class="mt-3 flex gap-2">
            <button class="bg-[#a88cd9] text-white text-xs font-semibold rounded px-3 py-1 hover:bg-[#8a6fc1] transition">Chỉnh sửa</button>
            <button class="bg-[#f87171] text-white text-xs font-semibold rounded px-3 py-1 hover:bg-[#ef4444] transition">Xóa</button>
            <button class="bg-[#34d399] text-white text-xs font-semibold rounded px-3 py-1 hover:bg-[#059669] transition">Lưu</button>
          </div>
        </div>
      </div>
      <!-- Fish Profile Block End -->
      <!-- Banner, nav tabs (ẩn hoặc chỉ hiện POSTS), header, about me, posts list, ... -->
      <!-- ... (copy nguyên phần nội dung tab POSTS từ index (2).html) ... -->
    </section>
  </main>
  <!-- Player JS (nếu có) -->
</body>
</html>
